[project]
name = "bjj-rules-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rafael De Moraes Lima", email = "rafaelmrslima@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-community<0.4.2",
    "ollama>=0.6.2",
    "openai>=3.22.1",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "ragas>=0.3.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
bjj-ingest = "bjj_rules_rag:insert_chunks"
bjj-ask = "bjj_rules_rag:ask"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
